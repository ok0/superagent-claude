<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="t">
  <rect x="0" y="0" width="100%" height="100%" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <title id="t">superagent-claude flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g fill="#f6f8fa" stroke="#57606a">
    <rect x="20" y="70" width="150" height="80" rx="6"/>
    <rect x="205" y="70" width="150" height="80" rx="6"/>
    <rect x="390" y="70" width="150" height="80" rx="6"/>
    <rect x="575" y="70" width="150" height="80" rx="6"/>
    <rect x="760" y="70" width="150" height="80" rx="6"/>
  </g>
  <g stroke="#57606a" stroke-width="2" fill="none">
    <line x1="170" y1="110" x2="205" y2="110" marker-end="url(#arrow)"/>
    <line x1="355" y1="110" x2="390" y2="110" marker-end="url(#arrow)"/>
    <line x1="540" y1="110" x2="575" y2="110" marker-end="url(#arrow)"/>
    <line x1="725" y1="110" x2="760" y2="110" marker-end="url(#arrow)"/>
  </g>
  <g fill="#1f2328" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">
    <text x="95" y="104">
