# issuecrew on Kubernetes: one replica, state on a ReadWriteOnce volume.
# The Secret below holds empty placeholders only; set the values with kubectl create secret (docs/deploy.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: issuecrew
  labels:
    app.kubernetes.io/name: issuecrew
data:
  issuecrew.json: |
    {
      "repositories": ["<owner>/<repository>"],
      "policy": { "allowed": ["<github-login>"] },
      "security": { "weakerNestedSandbox": true }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: issuecrew
  labels:
    app.kubernetes.io/name: issuecrew
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  ISSUECREW_GITHUB_TOKEN: ""
  ANTHROPIC_API_KEY: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: issuecrew-state
  labels:
    app.kubernetes.io/name: issuecrew
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuecrew
  labels:
    app.kubernetes.io/name: issuecrew
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: issuecrew
  template:
    metadata:
      labels:
        app.kubernetes.io/name: issuecrew
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issuecrew
          image: issuecrew:local
          imagePullPolicy: IfNotPresent
          args: ["start", "--config", "/etc/issuecrew/issuecrew.json", "--log-format", "json"]
          envFrom:
            - secretRef:
                name: issuecrew
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["issuecrew", "health", "--ready", "--config", "/etc/issuecrew/issuecrew.json"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["issuecrew", "health", "--live", "--config", "/etc/issuecrew/issuecrew.json"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /var/lib/issuecrew
            - name: config
              mountPath: /etc/issuecrew
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: issuecrew-state
        - name: config
          configMap:
            name: issuecrew
